name: Generate Design Doc & Diagrams

on:
  push:
    branches:
      - deliverable/att-business-design
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre graphviz pandoc wget unzip

      - name: Download PlantUML jar
        run: |
          mkdir -p .work
          wget -q -O .work/plantuml.jar https://netcologne.dl.sourceforge.net/project/plantuml/plantuml.jar

      - name: Render PlantUML diagrams to PNG
        run: |
          mkdir -p diagrams/output
          java -jar .work/plantuml.jar -tpng diagrams/high-level-architecture.puml -o diagrams/output || true
          java -jar .work/plantuml.jar -tpng diagrams/content-authoring-flow.puml -o diagrams/output || true
          java -jar .work/plantuml.jar -tpng diagrams/ci-cd-flow.puml -o diagrams/output || true

      - name: Create Markdown with embedded images
        run: |
          mkdir -p docs
          if [ -f ATT-BUSINESS-SOLUTION-DESIGN.md ]; then
            cp ATT-BUSINESS-SOLUTION-DESIGN.md docs/ATT-BUSINESS-SOLUTION-DESIGN-with-diagrams.md
          else
            echo "# AT&T Business - Solution Design Document" > docs/ATT-BUSINESS-SOLUTION-DESIGN-with-diagrams.md
          fi
          cat >> docs/ATT-BUSINESS-SOLUTION-DESIGN-with-diagrams.md <<'MD'

## Architecture Diagrams

### High-level Architecture
![High-level Architecture](diagrams/output/high-level-architecture.png){ width=600px }

### Content & Authoring Flow
![Content & Authoring Flow](diagrams/output/content-authoring-flow.png){ width=600px }

### CI/CD Flow
![Code Deployment / CI Flow](diagrams/output/ci-cd-flow.png){ width=600px }
MD

      - name: Generate DOCX via Pandoc
        run: |
          pandoc -s docs/ATT-BUSINESS-SOLUTION-DESIGN-with-diagrams.md -o ATT-BUSINESS-SOLUTION-DESIGN.docx --resource-path=.:diagrams/output

      - name: Commit generated artifacts
        env:
          BRANCH: deliverable/att-business-design
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ATT-BUSINESS-SOLUTION-DESIGN.docx docs/ATT-BUSINESS-SOLUTION-DESIGN-with-diagrams.md diagrams/output/*.png || true
          git commit -m "ci: generate docx and diagram PNGs" || echo "No changes to commit"
          git push origin HEAD:${BRANCH}
